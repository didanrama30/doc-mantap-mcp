[project]
name = "doc-mantap-mcp"
version = "0.1.0"
description = "MCP server that makes AI-generated documents look beautiful (PDF & DOCX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "markdown>=3.5",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "weasyprint>=62.0",
]

[project.scripts]
doc-mantap-mcp = "doc_mantap_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_mantap_mcp"]
